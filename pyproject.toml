[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "thinkbook-fanctl"
version = "0.1.0"
description = "Fan telemetry and bounded manual control for Lenovo ThinkBook 21LG"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = []
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware",
]

[project.scripts]
thinkbook-fanctl = "thinkbook_fanctl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.format]
quote-style = "single"
